[package]
name = "bossbar-daemon"
version.workspace = true
edition.workspace = true
rust-version = "1.95"
license.workspace = true
description = "GUI-less background process drawing the bossbar pill overlay"

[[bin]]
name = "bossbar-daemon"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.96"
bossbar-proto = { path = "../bossbar-proto" }
dirs = "6"
egui = { version = "0.36.2", default-features = false }
eframe = { version = "0.36.2", default-features = false, features = [
    "default_fonts",
    "accesskit",
    "x11",
    "wayland",
    "wgpu",
] }
fs2 = "0.4.3"
image = "0.25"
serde_json = "1.0.138"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "std"] }
tray-icon = { version = "0.25.1", default-features = false }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
xcap = "0.4"

[dev-dependencies]
egui_kittest = { version = "0.36.2", features = ["wgpu", "snapshot"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
tray-icon = { version = "0.25.1", default-features = false }
wgpu = { version = "30.0", default-features = false, features = ["vulkan"] }
# gpu-allocator 0.28 caps windows at <=0.62 (i.e. 0.62.0). Keep its
# Direct3D types aligned with wgpu-hal 30, which requires windows 0.62.
windows = { version = "=0.62.0", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.25.1", default-features = false, features = ["ksni"] }
wgpu = { version = "30.0", default-features = false, features = ["gles", "vulkan"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23"
objc2 = "0.6"
raw-window-handle = "0.6"
tray-icon = { version = "0.25.1", default-features = false }
wgpu = { version = "30.0", default-features = false, features = ["metal"] }
