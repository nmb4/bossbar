[package]
name = "bossbar-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line client for the bossbar daemon"

[[bin]]
name = "bossbar"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.96"
bossbar-proto = { path = "../bossbar-proto" }
clap = { version = "4.5.23", features = ["derive"] }
serde_json = "1.0.138"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
